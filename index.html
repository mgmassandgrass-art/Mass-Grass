/* ---------- header ---------- */
.hdr{position:fixed;left:0;right:0;top:0;z-index:3000;height:88px;display:flex;align-items:center;justify-content:space-between;padding:0 clamp(16px,4.4vw,70px);pointer-events:none;direction:ltr}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:3px solid var(--ink);border-radius:8px;padding:13px 20px 14px;background:var(--red);color:#FBF6EA;

.btn:hover{transform:translate(-2px,-2px);box-shadow:7px 8px 0 var(--shadow)}

.center{text-align:center}
.sub{font:500 17px/1.8 var(--f-ar);max-width:56ch;margin:16px auto 0;opacity:.85}

/* ================= soon page ================= */
/* ---------- paper theme: the same paper as the launch reel (cream sheet, fibres, soft folds) ---------- */
:root{--yellow:#EAE6DC;--ink:#262627;--cream:#F8F6EF;--shadow:#262627;--glow:#F1EEE5;--grain-o:.08;
  --paper-bg:url(assets/paper-creases.png),url(assets/paper-tile.jpg);--paper-sz:2200px 3106px,2200px 3106px;--paper-rp:repeat,repeat}

  --paper-bg:linear-gradient(rgba(27,27,28,.86),rgba(27,27,28,.86)),url(assets/paper-tile.jpg);--paper-sz:auto,2200px 3106px;--paper-rp:no-repeat,repeat}}
:root[data-theme="dark"]{--yellow:#1B1B1C;--ink:#EBEBE8;--cream:#272728;--shadow:#050505;--glow:#2A2A2B;--grain-o:.12;
  --paper-bg:linear-gradient(rgba(27,27,28,.86),rgba(27,27,28,.86)),url(assets/paper-tile.jpg);--paper-sz:auto,2200px 3106px;--paper-rp:no-repeat,repeat}
body,.drawer nav{background-color:var(--yellow);background-image:var(--paper-bg);background-size:var(--paper-sz);background-repeat:var(--paper-rp)}
.sec.alt{background:color-mix(in srgb,var(--cream) 48%,transparent)}
:root{--sun:#E2A04A;--road:58px}
:root[data-theme=dark]{--sun:#D8C9A4}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){--sun:#D8C9A4}}
.hdr .logo{pointer-events:auto}

/* ---------- hero ---------- */
.hero{position:relative;min-height:100svh;display:flex;flex-direction:column;overflow:hidden;padding-top:88px;isolation:isolate}
.sky{position:absolute;inset:0;pointer-events:none;z-index:0;overflow:hidden}
.cloud{position:absolute;left:0;width:clamp(110px,14vw,210px);fill:var(--cream);stroke:var(--ink);stroke-width:2.6;stroke-linejoin:round;filter:drop-shadow(5px 6px 0 var(--shadow));
  animation:drift var(--t,90s) linear var(--dl,0s) infinite;translate:-30vw 0}
.cloud.c1{top:17%;--t:96s;--dl:-30s}.cloud.c2{top:41%;width:clamp(80px,10vw,150px);--t:120s;--dl:-80s}.cloud.c3{top:8%;width:clamp(90px,11vw,170px);--t:140s;--dl:-10s}
@keyframes drift{from{translate:-30vw 0}to{translate:130vw 0}}
.hl{position:relative;z-index:5;flex:1;display:flex;flex-direction:column;align-items:center;text-align:center;padding:6px clamp(16px,5vw,80px) clamp(30px,3.4vw,46px)}
.hl .kick{margin-top:6px}
.word{position:relative;margin:clamp(20px,2.2vw,30px) auto 0;width:min(92vw,780px)}
.wshadow{filter:drop-shadow(9px 11px 0 var(--shadow));rotate:-1.6deg}
.wcard{padding:clamp(8px,1.6vw,22px) clamp(24px,5vw,72px) clamp(22px,3vw,40px);
  clip-path:polygon(0 1.2%,6% 0,21% .8%,38% 0,57% 1%,74% 0,91% .9%,100% 0,99.3% 18%,100% 39%,99.2% 61%,100% 82%,99.4% 100%,80% 99.2%,61% 100%,42% 99.1%,24% 100%,7% 99.3%,0 100%,.8% 79%,0 58%,.7% 37%,0 17%);
  --pc:var(--cream);transition:rotate .5s cubic-bezier(.2,1.4,.4,1)}
.word:hover .wcard{rotate:1deg}
.wcard h1{margin:0;font:400 clamp(80px,10.6vw,150px)/1.02 var(--f-ar-disp);color:var(--ink);letter-spacing:0}
body[data-lang=en] .wcard h1{font-family:var(--f-disp);text-transform:uppercase;line-height:.9;letter-spacing:.02em;font-size:clamp(84px,11.6vw,164px)}
.scrib{position:absolute;left:8%;right:8%;bottom:-3%;width:84%;height:clamp(14px,2.4vw,30px);pointer-events:none;overflow:visible}
.scrib path{fill:none;stroke:var(--red);stroke-width:8;stroke-linecap:round;vector-effect:non-scaling-stroke;stroke-dasharray:420;stroke-dashoffset:420;animation:draw 1.1s cubic-bezier(.5,0,.3,1) .9s forwards}
@keyframes draw{to{stroke-dashoffset:0}}
.dks{position:absolute;inset:0;pointer-events:none}
.dk{position:absolute;pointer-events:auto;border:0;padding:0;background:var(--i) center/contain no-repeat;aspect-ratio:var(--ar,1);width:var(--w);left:var(--x);top:var(--y);rotate:var(--r);
  filter:drop-shadow(3px 4px 0 var(--shadow));cursor:grab;touch-action:none;transition:filter .2s;z-index:3;animation:stk .7s cubic-bezier(.2,1.5,.4,1) backwards;animation-delay:calc(.5s + var(--n)*.12s)}
.dk:hover{filter:drop-shadow(5px 7px 0 var(--shadow))}.dk.drag{cursor:grabbing;filter:drop-shadow(8px 11px 0 var(--shadow));z-index:9;transition:none}
.dk.wob{animation:wob .6s cubic-bezier(.3,1.6,.5,1)}
@keyframes stk{from{opacity:0;scale:1.8;rotate:calc(var(--r) + 30deg)}}
@keyframes wob{30%{scale:1.18;rotate:calc(var(--r) - 10deg)}65%{scale:.94;rotate:calc(var(--r) + 6deg)}}

  filter:drop-shadow(5px 6px 0 var(--shadow));transition:filter .2s;animation:hpin .9s cubic-bezier(.2,1.4,.4,1) backwards;animation-delay:calc(.7s + var(--n)*.16s)}
.hp>i{display:block;aspect-ratio:var(--ar);border:7px solid #FBF9F4;background:var(--img) center/cover;clip-path:var(--cp);animation:flt 8s ease-in-out calc(var(--n)*-1.7s) infinite}

  filter:drop-shadow(5px 6px 0 var(--shadow));transition:translate .3s cubic-bezier(.2,1.4,.4,1),rotate .3s,filter .3s}

const pet=$('#pet');let px=-120,py=140,tx=0,ty=0,face=1,petRaf;

  tx=wr.left-hr.left+wr.width/2+Math.cos(a)*wr.width*.62;ty=wr.top-hr.top+wr.height*.5+Math.sin(a*1.3)*wr.height*.78;

const cvs=$('#cv'),scr=$('#scr');let ctx,CW,CH,dpr=1,painting=false,last=null,moves=0,done=false,pi=0,paper=null,bl=document.createElement('canvas');bl.width=48;bl.height=38;
function drawCover(){const r=cvs.getBoundingClientRect();if(!r.width)return;dpr=Math.min(2,devicePixelRatio||1);CW=cvs.width=Math.round(r.width*dpr);CH=cvs.height=Math.round(r.height*dpr);ctx=cvs.getContext('2d');
  ctx.globalCompositeOperation='source-over';ctx.fillStyle='#C9AD80';ctx.fillRect(0,0,CW,CH);
  if(paper){ctx.globalCompositeOperation='multiply';const pat=ctx.createPattern(paper,'repeat');ctx.fillStyle=pat;ctx.fillRect(0,0,CW,CH)}
  ctx.globalCompositeOperation='source-over';ctx.strokeStyle='rgba(60,35,10,.16)';ctx.lineWidth=2*dpr;
  for(let x=-CH;x<CW;x+=26*dpr){ctx.beginPath();ctx.moveTo(x,CH);ctx.lineTo(x+CH,0);ctx.stroke()}
  ctx.setLineDash([10*dpr,8*dpr]);ctx.strokeStyle='rgba(46,36,27,.55)';ctx.lineWidth=3*dpr;ctx.strokeRect(14*dpr,14*dpr,CW-28*dpr,CH-28*dpr);ctx.setLineDash([]);

  const fs=CW*(LANG==='ar'?.13:.12);ctx.font=`400 ${fs}px ${LANG==='ar'?'Lalezar':'Anton'}, sans-serif`;ctx.lineJoin='round';ctx.lineWidth=fs*.16;ctx.strokeStyle='#2E241B';
  const txt=LANG==='ar'?tr('scratchHere'):tr('scratchHere').toUpperCase();ctx.strokeText(txt,0,0);ctx.fillStyle='#FBF6EA';ctx.fillText(txt,0,0);ctx.restore();
  cvs.style.opacity=1;cvs.style.pointerEvents='auto';cvs.getAnimations().forEach(a=>a.cancel());scr.classList.remove('done');done=false;moves=0;setMeter(0)}
function setMeter(p){$('#pbar').style.width=p+'%';$('#ppct').textContent=num(p)+(LANG==='ar'?'٪':'%')}
function showPainting(){const p=PA[pi];$('#art').style.setProperty('--img',`var(--img-${p.img})`);$('#cap').textContent=p[LANG]}
function scratchSeg(a,b){ctx.globalCompositeOperation='destination-out';ctx.lineCap='round';ctx.lineJoin='round';ctx.lineWidth=CW*.085;ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.lineTo(b.x,b.y);ctx.stroke();ctx.globalCompositeOperation='source-over'}
function coverage(){const g=bl.getContext('2d');g.clearRect(0,0,48,38);g.drawImage(cvs,0,0,48,38);const d=g.getImageData(0,0,48,38).data;let c=0;for(let i=3;i<d.length;i+=4)if(d[i]<70)c++;return c/(48*38)}

cvs.addEventListener('pointerdown',e=>{if(done)return;e.preventDefault();cvs.setPointerCapture(e.pointerId);painting=true;last=pt(e);scratchSeg(last,last);moves++});
cvs.addEventListener('pointermove',e=>{if(!painting||done)return;const p=pt(e);scratchSeg(last,p);last=p;if(++moves%6===0){const f=coverage();setMeter(Math.min(100,Math.round(f/.5*100)));if(f>=.5)reveal()}});

/* ---------- language / theme / footer ---------- */
function footLinks(){const a=[];if(CFG.instagram)a.push(`<a href="${esc(CFG.instagram)}" target="_blank" rel="noopener">${esc(tr('insta'))}</a>`);if(CFG.email)a.push(`<a href="mailto:${esc(CFG.email)}">${esc(tr('mailus'))}</a>`);$('#flinks').innerHTML=a.join('')}
(function(){let s=77;const r=()=>(s=(s*16807)%2147483647)/2147483647;const pts=['0,0'];for(let i=0;i<=90;i++)pts.push((i/90*100).toFixed(2)+','+(i%2?r()*5+4:r()*3+1).toFixed(2));pts.push('100,0');$('#footEdge').setAttribute('points',pts.join(' '))})();
function applyLang(){
  document.body.dataset.lang=LANG;document.documentElement.lang=LANG;
  $$('[data-t]').forEach(n=>n.textContent=tr(n.dataset.t));$$('[data-tl]').forEach(n=>n.setAttribute('aria-label',tr(n.dataset.tl)));$$('[data-tp]').forEach(n=>n.placeholder=tr(n.dataset.tp));
  $('#langBtn').textContent=LANG==='ar'?'EN':'ع';$('#langBtn').setAttribute('aria-label',LANG==='ar'?'English':'العربية');
  document.title=LANG==='ar'?'Mass & Grass · قريباً':'Mass & Grass · Soon';
  truck.style.setProperty('--dir',LANG==='ar'?1:-1);
  $('#msent').textContent=tr('sent');
  footLinks();buildEnvs();buildWall();observeRv();showPainting();setMeter(0);
  if(!busy){setX(parkX());placeHint()}
  if(ctx&&!document.body.classList.contains('x'))drawCover();
}
$('#langBtn').onclick=()=>{LANG=LANG==='ar'?'en':'ar';try{localStorage.setItem('mg-lang',LANG)}catch(e){}applyLang()};
const dmq=matchMedia('(prefers-color-scheme: dark)');
function isDark(){const t=document.documentElement.dataset.theme;return t?t==='dark':dmq.matches}
function syncTheme(){const d=isDark();document.documentElement.dataset.theme=d?'dark':'light';$('#themeBtn').setAttribute('aria-label',tr(d?'light':'dark'))}
try{const t=localStorage.getItem('mg-theme');if(t)document.documentElement.dataset.theme=t}catch(e){}
$('#themeBtn').onclick=()=>{const n=isDark()?'light':'dark';document.documentElement.dataset.theme=n;try{localStorage.setItem('mg-theme',n)}catch(e){}syncTheme()};
let rz;addEventListener('resize',()=>{clearTimeout(rz);rz=setTimeout(()=>{if(!busy){setX(parkX());placeHint()}if(!done&&!painting)drawCover()},200)});
/* ---------- protect the artwork a little: no right-click save / drag on pictures ---------- */
document.addEventListener('contextmenu',e=>{if(e.target.closest&&e.target.closest('.hp,.wc,.scr,.dk,.env,.burst'))e.preventDefault()});
document.addEventListener('dragstart',e=>{if(e.target.closest&&e.target.closest('.hp,.wc,.scr,.dk,.env'))e.preventDefault()});
/* ---------- go ---------- */
buildStickers();applyLang();syncTheme();intro();
const pimg=new Image();pimg.onload=()=>{paper=pimg;drawCover()};pimg.src=cssUrl('--img-paper');
(document.fonts&&document.fonts.ready?document.fonts.ready:Promise.resolve()).then(()=>{drawCover();if(!busy&&!truck.classList.contains('moving')){setX(parkX())}placeHint()});
window.__soon={reveal,drawCover,get busy(){return busy}};
})();
</script>

</html>

<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>لوحة التحكم · Mass &amp; Grass</title>
<link rel="icon" href="../assets/logo.svg">
<link rel="stylesheet" href="../fonts/fonts.css">
<style>
:root{--field:#E9DCC2;--ink:#2E241B;--paper:#FAF5E9;--terra:#C4593F;--sage:#66805A;--ochre:#D9A441;--sky:#3f6b8a;--soft:#6f604d;
  --en:'Anton',Impact,sans-serif;--ar:'Lalezar','IBM Plex Sans Arabic',sans-serif;--body:'IBM Plex Sans Arabic',system-ui,sans-serif;--mono:'IBM Plex Mono',ui-monospace,monospace}
*{box-sizing:border-box;margin:0}
body{background:var(--field) url(../assets/paper.jpg);background-blend-mode:multiply;color:var(--ink);font:15px/1.55 var(--body);min-height:100vh}
a{color:inherit}
header{display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding:14px clamp(16px,3vw,34px);border-bottom:2px solid var(--ink);background:var(--paper);position:sticky;top:0;z-index:20}
header img{height:34px}
header h1{font:26px/1 var(--ar);margin-inline-end:auto}
nav{display:flex;gap:6px;flex-wrap:wrap}
nav button,.tag{border:1.5px solid var(--ink);background:var(--paper);font:600 13px/1 var(--mono);padding:9px 12px;cursor:pointer;box-shadow:2px 2px 0 rgba(46,36,27,.25)}
nav button[aria-current=true]{background:var(--ink);color:var(--paper)}
main{padding:clamp(16px,3vw,34px);max-width:1280px;margin:auto}
h2{font:30px/1.1 var(--ar);margin-bottom:14px}
.card{background:var(--paper);border:2px solid var(--ink);box-shadow:5px 5px 0 rgba(46,36,27,.85);padding:18px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:16px}
.stats .card b{display:block;font:44px/1 var(--en)}
.stats .card span{font:600 12px var(--mono);color:var(--soft)}
.btn{display:inline-flex;align-items:center;gap:8px;border:2px solid var(--ink);background:var(--ink);color:var(--paper);padding:10px 16px;font:15px/1 var(--ar);cursor:pointer;box-shadow:3px 3px 0 rgba(196,89,63,.45)}
.btn.alt{background:var(--paper);color:var(--ink)}
.btn.red{background:var(--terra);border-color:var(--terra)}
.btn:disabled{opacity:.5;cursor:default}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
input,select,textarea{font:15px var(--body);border:1.5px solid var(--ink);background:#fff;padding:9px 10px;width:100%}
label{display:grid;gap:4px;font:600 12px var(--mono)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:16px}
.pc{background:var(--paper);border:2px solid var(--ink);box-shadow:4px 4px 0 rgba(46,36,27,.8);display:flex;flex-direction:column}
.pc .im{aspect-ratio:1;background:#fff;display:grid;place-items:center;border-bottom:1.5px solid var(--ink);padding:8px}
.pc .im img{max-width:100%;max-height:100%;object-fit:contain}
.pc .bd{padding:10px;display:grid;gap:4px;flex:1}
.pc h3{font:18px/1.2 var(--ar)}
.pc small{color:var(--soft);font:12px var(--mono)}
.pc .ac{display:flex;gap:6px;padding:10px;border-top:1.5px dashed var(--ink)}
.pc.off{opacity:.55}
.badge{display:inline-block;font:600 11px var(--mono);padding:2px 6px;border:1.5px solid var(--ink);margin-inline-end:4px}
.badge.sale{background:var(--terra);color:#fff;border-color:var(--terra)}.badge.new{background:var(--ochre)}.badge.hid{background:#ccc}
table{width:100%;border-collapse:collapse;background:var(--paper);border:2px solid var(--ink)}
th,td{padding:9px 10px;border-bottom:1px solid rgba(46,36,27,.2);text-align:start;font-size:14px;vertical-align:top}
th{font:600 12px var(--mono);background:var(--ink);color:var(--paper)}
.tw{overflow-x:auto}
.st{font:600 12px var(--mono);padding:2px 6px;border:1.5px solid var(--ink)}
.st.paid{background:var(--sage);color:#fff}.st.pending{background:var(--ochre)}.st.cancelled,.st.refunded{background:#ccc}
dialog{border:2px solid var(--ink);background:var(--paper);box-shadow:8px 8px 0 rgba(46,36,27,.85);padding:0;width:min(720px,94vw);max-height:92vh}
dialog::backdrop{background:rgba(46,36,27,.45)}
dialog form{padding:20px;display:grid;gap:12px;overflow:auto;max-height:92vh}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.chk{display:flex;gap:8px;align-items:center;font:14px var(--body)}
.chk input{width:auto}
.prev{width:120px;height:120px;border:1.5px solid var(--ink);background:#fff;display:grid;place-items:center}
.prev img{max-width:100%;max-height:100%}
.toast{position:fixed;bottom:20px;inset-inline-start:20px;background:var(--ink);color:var(--paper);padding:12px 16px;font:14px var(--body);z-index:99;display:none}
.muted{color:var(--soft);font-size:13px}
@media(max-width:640px){.two{grid-template-columns:1fr}header h1{font-size:20px}}
</style>
</head>
<body>
<header>
  <img src="../assets/logo.svg" alt="Mass &amp; Grass">
  <h1>لوحة التحكم</h1>
  <nav id="nav">
    <button data-v="home">الرئيسية</button><button data-v="products">المنتجات</button><button data-v="prices">الأسعار والإعدادات</button>
    <button data-v="customers">الزبائن</button><button data-v="orders">الطلبات</button><button data-v="me">حسابي</button>
  </nav>
  <a class="tag" href="../" target="_blank">الموقع ↗</a>
</header>
<main id="main"></main>
<dialog id="dlg"></dialog>
<div class="toast" id="toast"></div>
<script>
(()=>{
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function api(m,p,b,raw){const r=await fetch('/api/admin/'+p,{method:m,headers:raw?{'content-type':raw}:b?{'content-type':'application/json'}:{},body:raw?b:b?JSON.stringify(b):undefined});
  const d=await r.json().catch(()=>({}));if(r.status===404&&d.error==='not_found'&&p!=='products')location.href='/account.html?next=admin/';if(!r.ok)throw new Error(d.error||r.status);return d}
const toast=m=>{const t=$('#toast');t.textContent=m;t.style.display='block';clearTimeout(toast.h);toast.h=setTimeout(()=>t.style.display='none',2600)};
const KIND={painting:'لوحة',postcard:'بوست كارد',sticker:'ستكر'};
const money=n=>'€'+(+n).toFixed(2).replace(/\.00$/,'');
const date=d=>new Date(d).toLocaleString('en-GB',{dateStyle:'medium',timeStyle:'short'});
const imgSrc=p=>'../assets/'+p.id+'.webp';
let view=location.hash.slice(1)||'home',PRICES={},PRODUCTS=[];

const V={
async home(){const s=await api('GET','stats');
  return `<h2>أهلًا 👋</h2><div class="stats">
   <div class="card"><b>${s.products}</b><span>منتج</span></div><div class="card"><b>${s.users}</b><span>زبون مسجّل</span></div>
   <div class="card"><b>${s.orders}</b><span>طلب مدفوع</span></div><div class="card"><b>${money(s.revenue)}</b><span>مجموع المبيعات</span></div></div>`},
async products(){const d=await api('GET','products');PRODUCTS=d.products;PRICES=(await api('GET','settings')).prices;
  const f=sessionStorage.mgAdminKind||'painting',q=(sessionStorage.mgAdminQ||'').toLowerCase();
  const list=PRODUCTS.filter(p=>p.kind===f&&(!q||(p.title_en+p.title_ar+p.id).toLowerCase().includes(q)));
  return `<div class="row"><h2 style="margin:0 0 0 auto">المنتجات</h2><button class="btn" id="add">+ منتج جديد</button></div>
   <div class="row">${Object.entries(KIND).map(([k,v])=>`<button class="btn ${k===f?'':'alt'}" data-k="${k}">${v} (${PRODUCTS.filter(p=>p.kind===k).length})</button>`).join('')}
   <input id="q" placeholder="بحث..." value="${esc(q)}" style="max-width:240px"></div>
   <div class="grid">${list.map(p=>`<div class="pc ${p.hidden?'off':''}"><div class="im"><img src="${imgSrc(p)}" alt="" loading="lazy"></div>
     <div class="bd"><h3>${esc(p.title_ar||p.title_en)}</h3><small>${esc(p.title_en)} · ${esc(p.place_ar)}</small>
     <div>${p.sale?`<span class="badge sale">-${p.sale}%</span>`:''}${p.is_new?'<span class="badge new">جديد</span>':''}${p.hidden?'<span class="badge hid">مخفي</span>':''}</div>
     <small>${money(p.price??PRICES[p.kind]??0)}${p.price==null?' (الافتراضي)':''} · مبيعات ${p.sold}</small></div>
     <div class="ac"><button class="btn alt" data-e="${esc(p.id)}">تعديل</button><button class="btn alt" data-h="${esc(p.id)}">${p.hidden?'إظهار':'إخفاء'}</button><button class="btn red" data-d="${esc(p.id)}">حذف</button></div></div>`).join('')||'<p class="muted">ما في منتجات هون.</p>'}</div>`},
async prices(){const s=await api('GET','settings');const p=s.prices,r=s.rates,l=s.links;
  const n=(k,v,lab)=>`<label>${lab}<input type="number" min="0" step="0.01" name="${k}" value="${esc(v??'')}"></label>`;
  return `<h2>الأسعار والإعدادات</h2><form id="sf" class="card" style="display:grid;gap:18px">
   <div><h3 style="font:20px var(--ar);margin-bottom:8px">الأسعار الافتراضية (يورو)</h3><p class="muted">كل منتج ما إله سعر خاص بياخد هالسعر.</p>
   <div class="two">${n('p.painting',p.painting,'لوحة (ملف)')}${n('p.postcard',p.postcard,'بوست كارد')}${n('p.sticker',p.sticker,'ستكر واحد')}${n('p.pack',p.pack,'باكيت ٦ ستكرات')}${n('p.calendar',p.calendar,'تقويم PDF')}${n('p.subscription',p.subscription,'اشتراك لوحة كل شهر')}</div></div>
   <div><h3 style="font:20px var(--ar);margin-bottom:8px">أسعار صرف العملات (مقابل ١ يورو)</h3><div class="two">${n('r.USD',r.USD,'دولار USD')}${n('r.GBP',r.GBP,'جنيه GBP')}${n('r.ILS',r.ILS,'شيكل ILS')}</div></div>
   <div><h3 style="font:20px var(--ar);margin-bottom:8px">روابط التواصل</h3><div class="two">
    <label>الإيميل<input name="l.email" value="${esc(l.email||'')}" dir="ltr"></label><label>انستغرام<input name="l.instagram" value="${esc(l.instagram||'')}" dir="ltr"></label>
    <label>واتساب<input name="l.whatsapp" value="${esc(l.whatsapp||'')}" dir="ltr" placeholder="+970..."></label></div></div>
   <div><button class="btn">احفظ</button></div></form>`},
async customers(){const d=await api('GET','customers');const q=(sessionStorage.mgAdminCQ||'').toLowerCase();
  const list=d.customers.filter(c=>!q||(c.email+c.name).toLowerCase().includes(q));
  return `<div class="row"><h2 style="margin:0 0 0 auto">الزبائن (${d.customers.length})</h2><input id="cq" placeholder="بحث بالاسم أو الإيميل" value="${esc(q)}" style="max-width:260px"></div>
   <div class="tw"><table><tr><th>الاسم</th><th>الإيميل</th><th>الدخول</th><th>الطلبات</th><th>المصروف</th><th>انضم</th><th></th></tr>
   ${list.map(c=>`<tr><td>${esc(c.name)}${c.role==='admin'?' <span class="badge new">مدير</span>':''}</td><td dir="ltr">${esc(c.email)}</td><td>${c.via==='google'?'جوجل':'إيميل'}</td><td>${c.orders}</td><td>${money(c.spent)}</td><td>${date(c.joined)}</td>
   <td>${c.role==='admin'?'':`<button class="btn red" data-cd="${esc(c.id)}" data-ce="${esc(c.email)}">حذف</button>`}</td></tr>`).join('')}</table></div>`},
async orders(){const d=await api('GET','orders');const f=sessionStorage.mgAdminOS||'';
  const list=d.orders.filter(o=>!f||o.status===f);const S={paid:'مدفوع',pending:'بانتظار الدفع',cancelled:'ملغي',refunded:'مسترجع'};
  return `<div class="row"><h2 style="margin:0 0 0 auto">الطلبات (${d.orders.length})</h2><select id="os" style="max-width:200px"><option value="">الكل</option>${Object.entries(S).map(([k,v])=>`<option value="${k}" ${k===f?'selected':''}>${v}</option>`).join('')}</select></div>
   <div class="tw"><table><tr><th>رقم</th><th>التاريخ</th><th>الزبون</th><th>القطع</th><th>المجموع</th><th>الحالة</th></tr>
   ${list.map(o=>`<tr><td dir="ltr">${esc(o.id)}</td><td>${date(o.date)}</td><td>${esc(o.name)}<br><small dir="ltr">${esc(o.email)}</small></td>
   <td>${o.items.map(i=>`${esc(i.ta||i.t||i.k)} <small>(${esc(KIND[i.kind]||i.kind)})</small>${i.gift?` → هدية لـ ${esc(i.gift.to)}`:''}`).join('<br>')}</td><td>${money(o.total)}</td>
   <td><select data-o="${esc(o.id)}">${Object.entries(S).map(([k,v])=>`<option value="${k}" ${k===o.status?'selected':''}>${v}</option>`).join('')}</select></td></tr>`).join('')||'<tr><td colspan="6" class="muted">ما في طلبات لهلأ.</td></tr>'}</table></div>`},
async me(){const r=await fetch('/api/me').then(r=>r.json());
  return `<h2>حسابي</h2><div class="card" style="max-width:480px;display:grid;gap:12px"><p>داخل باسم <b dir="ltr">${esc(r.user&&r.user.email)}</b></p>
   <form id="pf" style="display:grid;gap:10px"><label>كلمة السر الحالية<input type="password" id="op" autocomplete="current-password"></label>
   <label>كلمة سر جديدة (١٠ أحرف أو أكثر)<input type="password" id="np" autocomplete="new-password"></label><button class="btn">غيّر كلمة السر</button></form>
   <button class="btn alt" id="lo">اطلع من الحساب</button></div>`}
};

async function show(v){view=V[v]?v:'home';history.replaceState(null,'','#'+view);$$('#nav button').forEach(b=>b.setAttribute('aria-current',b.dataset.v===view));
  $('#main').innerHTML='<p class="muted">عم يحمّل…</p>';
  try{$('#main').innerHTML=await V[view]();bind()}catch(e){$('#main').innerHTML=`<p class="card">صار خطأ: ${esc(e.message)}</p>`}}
$$('#nav button').forEach(b=>b.onclick=()=>show(b.dataset.v));

function bind(){
  $$('[data-k]').forEach(b=>b.onclick=()=>{sessionStorage.mgAdminKind=b.dataset.k;show('products')});
  const q=$('#q');if(q)q.onchange=()=>{sessionStorage.mgAdminQ=q.value;show('products')};
  const cq=$('#cq');if(cq)cq.onchange=()=>{sessionStorage.mgAdminCQ=cq.value;show('customers')};
  const os=$('#os');if(os)os.onchange=()=>{sessionStorage.mgAdminOS=os.value;show('orders')};
  const add=$('#add');if(add)add.onclick=()=>edit(null);
  const kind=sessionStorage.mgAdminKind||'painting',find=id=>PRODUCTS.find(p=>p.id===id&&p.kind===kind);
  $$('[data-e]').forEach(b=>b.onclick=()=>edit(find(b.dataset.e)));
  $$('[data-h]').forEach(b=>b.onclick=async()=>{const p=find(b.dataset.h);await api('PUT','products',Object.assign({},p,{hidden:!p.hidden}));toast(p.hidden?'صار ظاهر بالموقع':'انخفى من الموقع');show('products')});
  $$('[data-d]').forEach(b=>b.onclick=async()=>{const p=find(b.dataset.d);if(!confirm(`تحذف "${p.title_ar||p.title_en}" نهائيًا؟`))return;await api('DELETE',`products?id=${encodeURIComponent(p.id)}&kind=${p.kind}`);toast('انحذف');show('products')});
  $$('[data-cd]').forEach(b=>b.onclick=async()=>{if(!confirm(`تحذف حساب ${b.dataset.ce}؟ ما في رجعة.`))return;await api('DELETE','customers?id='+encodeURIComponent(b.dataset.cd));toast('انحذف الحساب');show('customers')});
  $$('[data-o]').forEach(s=>s.onchange=async()=>{await api('PUT','orders',{id:s.dataset.o,status:s.value});toast('انحفظت الحالة')});
  const sf=$('#sf');if(sf)sf.onsubmit=async e=>{e.preventDefault();const b={prices:{},rates:{},links:{}};
    new FormData(sf).forEach((v,k)=>{const[g,n]=k.split('.');const G={p:'prices',r:'rates',l:'links'}[g];if(v!=='')b[G][n]=g==='l'?v:+v});await api('PUT','settings',b);toast('انحفظ ✓')};
  const pf=$('#pf');if(pf)pf.onsubmit=async e=>{e.preventDefault();const r=await fetch('/api/me/password',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({old:$('#op').value,password:$('#np').value})});
    const d=await r.json().catch(()=>({}));toast(r.ok?'تغيّرت كلمة السر ✓':d.error==='password_short'?'لازم ١٠ أحرف أو أكثر':d.error==='bad_credentials'?'كلمة السر الحالية غلط':'صار خطأ');if(r.ok)pf.reset()};
  const lo=$('#lo');if(lo)lo.onclick=async()=>{await fetch('/api/logout',{method:'POST'});localStorage.removeItem('mgUser');location.href='/'};
}

// Resize to WebP (max 1600px) in the browser before upload, so D1 rows stay small.
function toWebp(file){return new Promise((ok,no)=>{const im=new Image();im.onload=()=>{const s=Math.min(1,1600/Math.max(im.width,im.height)),c=document.createElement('canvas');
  c.width=Math.round(im.width*s);c.height=Math.round(im.height*s);c.getContext('2d').drawImage(im,0,0,c.width,c.height);c.toBlob(b=>b?ok({b,ratio:+(im.width/im.height).toFixed(3)}):no(new Error('image')),'image/webp',.86)};im.onerror=()=>no(new Error('image'));im.src=URL.createObjectURL(file)})}

function edit(p){const isNew=!p,kind=p?p.kind:(sessionStorage.mgAdminKind||'painting');p=p||{kind,title_en:'',title_ar:'',place_en:'Gaza',place_ar:'غزة',story_en:'',story_ar:'',price:null,sale:0,is_new:true,hidden:false,extra:{}};
  const maps=[...new Set(PRODUCTS.map(x=>x.extra&&x.extra.map).filter(Boolean))];let up=null;
  const d=$('#dlg');d.innerHTML=`<form method="dialog" id="ef"><h2>${isNew?'منتج جديد':'تعديل'} · ${KIND[kind]}</h2>
   <div class="row"><div class="prev" id="pv">${isNew?'<span class="muted">صورة</span>':`<img src="${imgSrc(p)}" alt="">`}</div>
    ${isNew||p.id.startsWith('u-')?`<label style="flex:1">${isNew?'الصورة (إجباري)':'تغيير الصورة'}<input type="file" id="fi" accept="image/*"></label>`:'<p class="muted" style="flex:1">صورة هالمنتج من ملفات الموقع الأصلية.</p>'}</div>
   <div class="two"><label>العنوان بالعربي<input id="ta" value="${esc(p.title_ar)}" required></label><label>العنوان بالإنجليزي<input id="te" value="${esc(p.title_en)}" dir="ltr" required></label>
   <label>المكان بالعربي<input id="pa" value="${esc(p.place_ar)}"></label><label>المكان بالإنجليزي<input id="pe" value="${esc(p.place_en)}" dir="ltr"></label></div>
   <div class="two"><label>الحكاية بالعربي<textarea id="sa" rows="3">${esc(p.story_ar)}</textarea></label><label>الحكاية بالإنجليزي<textarea id="se" rows="3" dir="ltr">${esc(p.story_en)}</textarea></label></div>
   <div class="two"><label>السعر € (فاضي = الافتراضي ${money(PRICES[kind]??0)})<input id="pr" type="number" min="0" step="0.01" value="${p.price??''}"></label>
    <label>خصم %<input id="sl" type="number" min="0" max="90" value="${p.sale||0}"></label>
    ${kind==='painting'?`<label>مكانها على خريطة غزة<select id="mp">${maps.map(m=>`<option ${m===(p.extra.map||'gaza')?'selected':''}>${esc(m)}</option>`).join('')}</select></label>`:''}
    ${kind==='sticker'?`<label>شكل الستكر<select id="sh"><option value="die" ${p.extra.shape!=='rect'?'selected':''}>مقصوص</option><option value="rect" ${p.extra.shape==='rect'?'selected':''}>مستطيل</option></select></label>`:''}
    ${!isNew?`<label>الترتيب (رقم أصغر = أول)<input id="so" type="number" value="${p.sort||0}"></label>`:''}</div>
   <label class="chk"><input type="checkbox" id="nw" ${p.is_new?'checked':''}> علامة "جديد"</label>
   ${kind==='painting'?`<label class="chk"><input type="checkbox" id="hm" ${p.extra.home?'checked':''}> اعرضها على طاولة فرح بالصفحة الرئيسية</label>`:''}
   <label class="chk"><input type="checkbox" id="hd" ${p.hidden?'checked':''}> مخفي من الموقع</label>
   <p class="muted" id="er" style="color:var(--terra)"></p>
   <div class="row"><button class="btn" id="sv" value="save">احفظ</button><button class="btn alt" value="cancel" formnovalidate>إلغاء</button></div></form>`;
  d.showModal();
  const fi=$('#fi');if(fi)fi.onchange=async()=>{try{up=await toWebp(fi.files[0]);$('#pv').innerHTML=`<img src="${URL.createObjectURL(up.b)}" alt="">`}catch(e){$('#er').textContent='ما قدرنا نقرأ الصورة'}};
  $('#ef').onsubmit=async e=>{if(e.submitter&&e.submitter.value==='cancel')return;e.preventDefault();const sv=$('#sv');sv.disabled=true;$('#er').textContent='';
    try{if(isNew&&!up)throw new Error('اختار صورة أول');
      let id=p.id;if(up){const r=await api('POST','image'+(id&&id.startsWith('u-')?'?key='+id:''),up.b,'image/webp');id=r.key}
      const extra=Object.assign({},p.extra);if($('#mp'))extra.map=$('#mp').value;if($('#sh'))extra.shape=$('#sh').value;if($('#hm'))extra.home=$('#hm').checked?1:0;if(up&&kind==='painting')extra.ratio=up.ratio;
      await api(isNew?'POST':'PUT','products',{id,kind,title_ar:$('#ta').value,title_en:$('#te').value,place_ar:$('#pa').value,place_en:$('#pe').value,story_ar:$('#sa').value,story_en:$('#se').value,
        price:$('#pr').value,sale:$('#sl').value,is_new:$('#nw').checked,hidden:$('#hd').checked,sort:$('#so')?$('#so').value:0,extra});
      d.close();toast('انحفظ ✓ وبيظهر بالموقع خلال دقيقة');show('products')}
    catch(err){sv.disabled=false;$('#er').textContent={title_required:'العنوان بالإنجليزي إجباري',too_big:'الصورة كبيرة كتير',bad_price:'السعر مش مزبوط',exists:'هالمنتج موجود'}[err.message]||err.message}}}

show(view);
})();
</script>
</body>

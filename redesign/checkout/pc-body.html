 {k:'blueflowers',ar:'الزهور الزرقاء',en:'Blue flowers',w:{ar:'غزة',en:'Gaza'},d:{ar:'حمامة بيضاء فوق زهور زرقاء، وطفلة بفستان أحمر.',en:'A white dove over blue flowers, and a little girl in red.'}},

/* rack */
function buildRack(){const n=C.length,cw=Math.min(240,$('#rack').clientWidth*.42),R=cw*.62/Math.tan(Math.PI/n);
  $('#spin').style.setProperty('--cw',cw+'px');
  $('#spin').innerHTML=C.map((c,i)=>`<button class="c" data-i="${i}" aria-label="${esc(L(c))}" aria-pressed="${i===S.i}" style="transform:rotateY(${i*360/n}deg) translateZ(${R}px) translateY(${(i%2?14:-14)}px)"><i style="--img:${img(c.k)}"></i></button>`).join('');setRot()}
function setRot(){$('#spin').style.transform=`translateZ(-${$('#rack').clientWidth*.3}px) rotateY(${S.rot}deg)`;$('#spin').style.transition=reduce?'none':'transform .7s cubic-bezier(.2,1,.3,1)'}
function pick(i){S.i=(i+C.length)%C.length;S.rot=-S.i*360/C.length;setRot();$$('#spin .c').forEach(b=>b.setAttribute('aria-pressed',+b.dataset.i===S.i));renderCard()}
$('#rPrev').onclick=()=>pick(S.i-1);$('#rNext').onclick=()=>pick(S.i+1);
$('#spin').addEventListener('click',e=>{const b=e.target.closest('.c');if(b&&!drag.moved)pick(+b.dataset.i)});
const drag={x:0,on:false,moved:false};
$('#rack').addEventListener('pointerdown',e=>{drag.on=true;drag.moved=false;drag.x=e.clientX;drag.r=S.rot;$('#spin').style.transition='none'});
addEventListener('pointermove',e=>{if(!drag.on)return;const dx=e.clientX-drag.x;if(Math.abs(dx)>4)drag.moved=true;S.rot=drag.r+dx*.35*(LANG==='ar'?1:1);$('#spin').style.transform=`translateZ(-${$('#rack').clientWidth*.3}px) rotateY(${S.rot}deg)`});
addEventListener('pointerup',()=>{if(!drag.on)return;drag.on=false;if(drag.moved){const st=360/C.length;pick(Math.round(-S.rot/st))}});

/* card + composer */
function back(p){const c=cur(),m=$('#msg').value||tr('msgDef');
  $('#'+p+'Msg').textContent=m;$('#'+p+'Stamp').style.setProperty('--img',img(c.k));
  const pr=S.mode==='print';$('#'+p+'Name').textContent=pr?$('#to').value:'';$('#'+p+'Addr').textContent=pr?$('#ad').value:'';$('#'+p+'City').textContent=pr?$('#ct').value:'';}
function renderCard(){const c=cur();$('#bigImg').style.setProperty('--img',img(c.k));$('#b2Img').style.setProperty('--img',img(c.k));
  $('#cName').textContent=L(c);$('#cDesc').textContent=L(c.d);$('#cWhere').textContent=L(c.w);back('big');back('b2');
  const pm=`GAZA<br>${new Date().toLocaleDateString('en-GB',{day:'2-digit',month:'short'}).toUpperCase()}<br>MASS&amp;GRASS`;$('#pm').innerHTML=pm;$('#pm2').innerHTML=pm;$('#pm').classList.add('on');$('#pm2').classList.toggle('on',S.stamped)}
$('#big').onclick=()=>$('#big').classList.toggle('flip');$('#flipBtn').onclick=()=>$('#big').classList.toggle('flip');
$('#addOne').onclick=()=>toast(L(cur())+' · '+tr('added'));
function renderMode(){$('#sMode').innerHTML=['print','digital'].map(m=>`<button type="button" data-m="${m}" aria-pressed="${S.mode===m}">${esc(tr(m==='print'?'mPrint':'mDigital'))}</button>`).join('');
  $('#adrBox').hidden=S.mode!=='print';$('#mailBox').hidden=S.mode==='print';$('#sPrice').textContent=S.mode==='print'?'€4.50':'€0';
  $('#sGo').textContent=tr(S.mode==='print'?'goPrint':'goDigital');$('#sNote').textContent=tr(S.mode==='print'?'notePrint':'noteDigital');back('b2')}
$('#sMode').addEventListener('click',e=>{const b=e.target.closest('[data-m]');if(b){S.mode=b.dataset.m;renderMode()}});
['msg','to','ad','ct'].forEach(id=>$('#'+id).addEventListener('input',()=>{back('b2');back('big');$('#cnt').textContent=$('#msg').value.length+' / 220'}));
$('#stampBtn').onclick=()=>{S.stamped=true;const p=$('#pm2');p.classList.remove('on');void p.offsetWidth;p.classList.add('on')};
$('#sGo').onclick=async()=>{if(S.mode==='print'){toast(L(cur())+' · '+tr('added'));return}try{await navigator.clipboard.writeText('https://www.massandgrass.com/postcards/#card')}catch(e){}toast(tr('copied'))};

/* packs, stamps, wall */
function renderRest(){
  $('#packList').innerHTML=PACKS.map((p,i)=>`<button class="pk" data-p="${i}"><span class="kenv"><img class="eb" src="img/obj/envelope-back.webp" alt="">${p.ks.map((k,j)=>`<i style="--img:${img(k)};--r:${(j-1)*7}deg;--x:${(j-1)*14}%"></i>`).join('')}<img class="ef" src="img/obj/envelope-front.webp" alt=""></span><b>${esc(L(p))}</b><small>${p.n} ${LANG==='ar'?'بطاقات':'cards'}</small><span class="p num">€${p.p}</span></button>`).join('');
  const W=[['Copenhagen','كوبنهاغن','boattop',-4],['London','لندن','waves',3],['Amman','عمّان','house',-2],['Berlin','برلين','dovegirl',4],['Paris','باريس','coast',-3],['Toronto','تورنتو','blueflowers',2]];
  $('#stamps').innerHTML=W.map(([e,a,k,r],i)=>`<div class="st" style="--r:${r}deg"><i style="--img:${img(k)}"></i><b>${LANG==='ar'?a:e}</b><small class="num">× ${[42,31,27,19,14,9][i]}</small></div>`).join('');
  renderNotes()}
let NOTES=[{t:{ar:'علّقت بطاقة البحر فوق مكتبي. كل صباح أتذكر غزة.',en:'I pinned the sea card above my desk. Every morning I think of Gaza.'},f:'Lina · Amman'},{t:{ar:'أرسلت الحمام لأمي، بكت عندما وصلت.',en:'I sent The doves to my mother. She cried when it arrived.'},f:'Sami · London'},{t:{ar:'استمري يا فرح، رسوماتك وصلت.',en:'Keep going, Farah. Your drawings arrived.'},f:'Maja · Copenhagen'}];

$('#noteForm').addEventListener('submit',e=>{e.preventDefault();const v=$('#noteIn').value.trim();if(!v)return;const n={t:v,f:LANG==='ar'?'أنت':'You'};NOTES.push(n);try{const s=JSON.parse(localStorage.getItem('mg-notes')||'[]');s.push(n);localStorage.setItem('mg-notes',JSON.stringify(s))}catch(e){}$('#noteIn').value='';renderNotes()});
$('#packList').addEventListener('click',e=>{const b=e.target.closest('.pk');if(b)openPack(+b.dataset.p)});
/* the envelope of cards at the top: pick one, it comes out large, turn it over, put it back */
function renderPenv(){const n=C.length;$('#pcs').innerHTML=C.map((c,i)=>{const a=(i-(n-1)/2);return `<button class="pcx" data-i="${i}" style="--x:${a*9}%;--r:${a*4}deg;--y:${Math.abs(a)*3}%;--d:${i*60}ms" aria-label="${esc(L(c))}"><i style="--img:${img(c.k)}"></i></button>`}).join('')}
$('#pcs').addEventListener('click',e=>{const b=e.target.closest('.pcx');if(b)openPC(+b.dataset.i,b)});
function dlg(){let d=$('#pcv');if(!d){d=document.createElement('dialog');d.id='pcv';d.className='pcv';document.body.appendChild(d);d.addEventListener('click',e=>{if(e.target===d||e.target.closest('[data-x]'))closePC()})}return d}
let PCI=0,PCFROM=null;
function openPC(i,from){PCI=i;PCFROM=from||null;const d=dlg(),c=C[i];d.dir=LANG==='ar'?'rtl':'ltr';
  d.innerHTML=`<button class="x" data-x aria-label="${esc(tr('close')||'×')}">×</button><div class="pcvb"><button class="pc big" id="pcvCard" aria-label="flip"><div class="f"><div class="s fr"><i style="--img:${img(c.k)}"></i></div><div class="s bk"><div class="msg">Greetings from Gaza,<br>with love, F.</div><div class="adr"><span></span><span></span><span></span></div><span class="stamp"></span></div></div></button>
   <div class="pcvt"><small>${esc(L(c.w))}</small><h3>${esc(L(c))}</h3><p>${esc(L(c.d))}</p><b class="num">€3</b><div class="pcvbtn"><button class="btn pri" id="pcvAdd">${LANG==='ar'?'أضف إلى السلة':'Add to basket'}</button><button class="btn" id="pcvFlip">${LANG==='ar'?'اقلبوها':'Turn it over'}</button></div>
   <div class="pcvnav"><button class="ib" id="pcvP" aria-label="prev">‹</button><button class="ib" id="pcvN" aria-label="next">›</button></div><p class="pcvs" role="status"></p></div></div>`;
  const fl=()=>$('#pcvCard').classList.toggle('flip');$('#pcvCard').onclick=fl;$('#pcvFlip').onclick=fl;
  $('#pcvAdd').onclick=()=>{MGCart.add('PCD',c.k,{pack:'P1'},1);d.querySelector('.pcvs').textContent=tr('added')};
  $('#pcvP').onclick=()=>openPC((PCI-1+C.length)%C.length);$('#pcvN').onclick=()=>openPC((PCI+1)%C.length);
  if(!d.open){d.showModal();if(from&&!reduce){const r=from.getBoundingClientRect(),q=$('#pcvCard').getBoundingClientRect();$('#pcvCard').animate([{transform:`translate(${r.left+r.width/2-q.left-q.width/2}px,${r.top+r.height/2-q.top-q.height/2}px) scale(${r.width/q.width}) rotate(${getComputedStyle(from).getPropertyValue('--r')})`},{transform:'none'}],{duration:600,easing:'cubic-bezier(.2,.9,.25,1)'})}}}
function closePC(){const d=$('#pcv');if(!d)return;const from=PCFROM&&PCFROM.isConnected?PCFROM:null;if(from&&!reduce&&$('#pcvCard')){const r=from.getBoundingClientRect(),q=$('#pcvCard').getBoundingClientRect();$('#pcvCard').classList.remove('flip');
  $('#pcvCard').animate([{transform:'none'},{transform:`translate(${r.left+r.width/2-q.left-q.width/2}px,${r.top+r.height/2-q.top-q.height/2}px) scale(${r.width/q.width})`}],{duration:450,easing:'cubic-bezier(.5,0,.75,0)'}).onfinish=()=>d.close()}else d.close()}
/* packs: open the envelope to see the cards inside */
function openPack(i){const p=PACKS[i],d=dlg();d.dir=LANG==='ar'?'rtl':'ltr';PCFROM=null;
  d.innerHTML=`<button class="x" data-x aria-label="×">×</button><div class="pkv"><div class="pkcards">${p.ks.concat(p.n>3?C.filter(c=>!p.ks.includes(c.k)).slice(0,p.n-3).map(c=>c.k):[]).map((k,j)=>`<span class="pkc" style="--d:${j*90}ms;--r:${(j%2?1:-1)*(2+j)}deg"><i style="--img:${img(k)}"></i></span>`).join('')}</div>
   <div class="pcvt"><small>${p.n} ${LANG==='ar'?'بطاقات في ظرف':'cards in an envelope'}</small><h3>${esc(L(p))}</h3><b class="num">€${p.p}</b><div class="pcvbtn"><button class="btn pri" id="pkAdd">${LANG==='ar'?'أضف المجموعة إلى السلة':'Add the pack to basket'}</button></div><p class="pcvs" role="status"></p></div></div>`;
  $('#pkAdd').onclick=()=>{MGCart.add('PCK',null,{series:['SEA','PPL','HOM','MIX'][i]},1);d.querySelector('.pcvs').textContent=tr('added')};d.showModal()}

/* lang / theme / nav */
function applyLang(){document.body.dataset.lang=LANG;document.documentElement.lang=LANG;document.documentElement.dir=LANG==='ar'?'rtl':'ltr';
  $$('[data-t]').forEach(n=>n.textContent=tr(n.dataset.t));$$('[data-tl]').forEach(n=>n.setAttribute('aria-label',tr(n.dataset.tl)));$$('[data-tp]').forEach(n=>n.placeholder=tr(n.dataset.tp));
  $('#addOne').textContent=tr('add1');$('#langBtn').textContent=LANG==='ar'?'EN':'ع';
  const links=`<a href="index.html">${esc(tr('home'))}</a>`+T.nav[LANG].map((t,i)=>`<a href="${NAV[i]}">${esc(t)}</a>`).join('');
  $('#navList').innerHTML=`<button class="xbtn" id="drawerX">${esc(tr('close'))}</button>`+links;$('#drawerX').onclick=()=>$('#drawer').hidden=true;$('#flinks').innerHTML=links;
  if(!$('#msg').value)$('#msg').placeholder=tr('msgDef');$('#cnt').textContent=$('#msg').value.length+' / 220';
  buildRack();renderPenv();renderCard();renderMode();renderRest();syncTheme()}
$('#langBtn').onclick=()=>{LANG=LANG==='ar'?'en':'ar';try{localStorage.setItem('mg-lang',LANG)}catch(e){}applyLang()};
const dmq=matchMedia('(prefers-color-scheme: dark)');function dark(){const t=document.documentElement.dataset.theme;return t?t==='dark':dmq.matches}

$('#themeBtn').onclick=()=>{const n=dark()?'light':'dark';document.documentElement.dataset.theme=n;try{localStorage.setItem('mg-theme',n)}catch(e){}syncTheme()};
$('#menuBtn').onclick=()=>$('#drawer').hidden=false;$('#drawer').addEventListener('click',e=>{if(e.target.id==='drawer'||e.target.tagName==='A')$('#drawer').hidden=true});
$('#bagBtn').onclick=()=>location.href='checkout.html';
(function(){let s=77;const r=()=>(s=(s*16807)%2147483647)/2147483647;const pts=['0,0'];for(let i=0;i<=90;i++)pts.push((i/90*100).toFixed(2)+','+(i%2?r()*5+4:r()*3+1).toFixed(2));pts.push('100,0');$('#footEdge').setAttribute('points',pts.join(' '))})();
addEventListener('resize',()=>buildRack());
applyLang();
})();

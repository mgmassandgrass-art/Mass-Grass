name = "mass-grass"
account_id = "8408909aa435938fe4a7bc63fa67da08"
main = "src/index.js"
compatibility_date = "2025-09-01"

# Production: the prototype site and the API on one origin (cookies stay first-party).
# The route sits in front of the old Pages site; delete the route to bring the old site back.
routes = [
  { pattern = "www.massandgrass.com/*", zone_name = "massandgrass.com" },
  { pattern = "massandgrass.com/*", zone_name = "massandgrass.com" }
]

[assets]
directory = "../prototype"
binding = "ASSETS"
run_worker_first = ["/*", "!/fonts/*"]

[vars]
ADMIN_EMAIL = "info@massandgrass.com"
SITE_ORIGIN = "https://www.massandgrass.com"
SOON = "1"
MAIL_FROM = "Mass & Grass <info@massandgrass.com>"

[[d1_databases]]
binding = "DB"
database_name = "mass-grass"
database_id = "38928e20-44ec-4df9-9522-ed2180a2dcef"
migrations_dir = "migrations"

# Secrets (set with `wrangler secret put NAME`, never committed):
#   GOOGLE_CLIENT_ID, GOOGLE_CLIENT_SECRET, RESEND_API_KEY
